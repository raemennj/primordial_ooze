<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#05080d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ooze Entry">
  <meta name="description" content="Add a member to the Primordial Ooze member list.">
  <link rel="manifest" href="member-entry.webmanifest">
  <link rel="icon" type="image/png" sizes="16x16" href="icon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>Primordial Ooze Member Entry</title>

  <style>
    :root {
      color-scheme: dark;
      --sky-x: 0;
      --sky-y: 0;
      --card-x: 0px;
      --card-y: 0px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      height: 100%;
      min-height: -webkit-fill-available;
      margin: 0;
      overflow: hidden;
      background: #05080d;
    }

    body {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      margin: 0;
      overflow: hidden;
      background: #05080d;
      color: #fff8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior: none;
    }

    main {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: grid;
      place-items: center;
      text-align: center;
      padding:
        max(22px, env(safe-area-inset-top))
        18px
        max(22px, env(safe-area-inset-bottom));
      overflow: hidden;
    }

    /*
      The background is split into three depths. The large negative insets keep
      the edge of the image outside the screen even during a full swipe.
    */
    .skybox,
    .skybox > div {
      position: fixed;
      pointer-events: none;
    }

    .skybox {
      z-index: -3;
      inset: -2px;
      overflow: hidden;
      background: #05080d;
    }

    .skybox-stars {
      inset: -10vmax;
      opacity: .38;
      background-image:
        radial-gradient(circle at 18% 27%, rgba(255, 255, 255, .9) 0 1px, transparent 1.6px),
        radial-gradient(circle at 72% 63%, rgba(255, 226, 157, .85) 0 1px, transparent 1.7px),
        radial-gradient(circle at 44% 81%, rgba(189, 224, 255, .8) 0 .8px, transparent 1.4px);
      background-size: 83px 91px, 127px 119px, 157px 143px;
      transform: translate3d(
        calc(var(--sky-x) * -9px),
        calc(var(--sky-y) * -9px),
        0
      );
      will-change: transform;
    }

    .skybox-world {
      inset: -15vmax;
      background:
        #05080d
        url("primordial_ooze_member_entry_bg.png")
        center center / cover no-repeat;
      transform:
        perspective(900px)
        translate3d(
          calc(var(--sky-x) * -42px),
          calc(var(--sky-y) * -42px),
          0
        )
        rotateY(calc(var(--sky-x) * 1.65deg))
        rotateX(calc(var(--sky-y) * -1.65deg))
        scale(1.12);
      transform-origin: center;
      will-change: transform;
    }

    .skybox-haze {
      inset: -18vmax;
      opacity: .26;
      filter: blur(18px);
      background:
        radial-gradient(ellipse at 66% 38%, rgba(229, 177, 67, .42), transparent 43%),
        radial-gradient(ellipse at 25% 70%, rgba(33, 119, 96, .28), transparent 48%);
      transform: translate3d(
        calc(var(--sky-x) * -62px),
        calc(var(--sky-y) * -62px),
        0
      );
      will-change: transform;
    }

    main::after {
      content: "";
      position: fixed;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(2, 5, 10, .18),
        rgba(2, 5, 10, .03) 48%,
        rgba(2, 5, 10, .30)
      );
    }

    .entry-card {
      width: min(100%, 390px);
      padding: 25px;
      border: 1px solid rgba(255, 222, 146, .28);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(8, 16, 24, .30), rgba(15, 19, 24, .18));
      box-shadow:
        0 20px 70px rgba(0, 0, 0, .34),
        inset 0 1px rgba(255, 255, 255, .08);
      -webkit-backdrop-filter: blur(13px) saturate(135%);
      backdrop-filter: blur(13px) saturate(135%);
      transform: translate3d(var(--card-x), var(--card-y), 0);
      will-change: transform;
    }

    .eyebrow {
      min-height: 0;
      margin: 0 0 7px;
      color: #e4b953;
      font-size: .71rem;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase;
      text-shadow: 0 1px 10px rgba(0, 0, 0, .85);
    }

    h1 {
      margin: 0 0 21px;
      font-size: 1.82rem;
      line-height: 1;
      letter-spacing: -.025em;
      text-shadow: 0 2px 18px rgba(0, 0, 0, .95);
    }

    label {
      display: block;
      margin: 15px 2px 7px;
      color: rgba(255, 249, 232, .93);
      font-size: .84rem;
      font-weight: 750;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .95);
    }

    input, button {
      width: 100%;
      min-height: 54px;
      border-radius: 13px;
      font: inherit;
    }

    input {
      border: 1px solid rgba(255, 255, 255, .28);
      padding: 0 15px;
      background: rgba(246, 248, 248, .82);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, .45),
        0 5px 20px rgba(0, 0, 0, .10);
      color: #101820;
      font-size: 16px;
    }

    input::placeholder { color: rgba(16, 24, 32, .52); }

    input:focus {
      outline: 3px solid rgba(237, 190, 78, .55);
      border-color: #e9be59;
      background: rgba(255, 255, 255, .94);
    }

    button {
      margin-top: 21px;
      border: 1px solid rgba(255, 235, 178, .32);
      background: linear-gradient(135deg, rgba(249, 214, 125, .92), rgba(177, 116, 26, .91));
      box-shadow:
        0 8px 28px rgba(67, 40, 0, .34),
        inset 0 1px rgba(255, 255, 255, .34);
      color: #172018;
      font-weight: 850;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active { transform: translateY(1px) scale(.995); }
    button:disabled { opacity: .65; cursor: wait; }

    [role="status"] {
      min-height: 1.25em;
      margin: 12px 2px 0;
      color: #ffe8aa;
      font-size: .87rem;
      text-shadow: 0 1px 8px #000;
    }

    .recent-entries {
      margin-top: 10px;
    }

    .recent-toggle {
      display: inline-block;
      border: 0;
      padding: 4px 2px;
      background: none;
      box-shadow: none;
      color: #ffe8aa;
      font-size: .87rem;
      font-weight: 750;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .recent-toggle:active { transform: none; }

    .recent-list {
      max-height: 210px;
      margin: 9px 0 0;
      padding: 0;
      overflow-y: auto;
      list-style: none;
      text-align: left;
    }

    .recent-item {
      display: grid;
      grid-template-columns: 1fr 34px;
      gap: 9px;
      align-items: center;
      padding: 9px 0;
      border-top: 1px solid rgba(255, 232, 170, .18);
    }

    .recent-details {
      min-width: 0;
      color: rgba(255, 249, 232, .94);
      font-size: .78rem;
      line-height: 1.35;
      text-shadow: 0 1px 7px #000;
    }

    .recent-details strong {
      display: block;
      overflow: hidden;
      color: #ffe8aa;
      font-size: .86rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .delete-entry {
      width: 34px;
      min-height: 34px;
      margin: 0;
      border: 1px solid rgba(255, 255, 255, .20);
      border-radius: 50%;
      padding: 0;
      background: rgba(5, 8, 13, .48);
      box-shadow: none;
      color: #ffe8aa;
      font-size: 1.15rem;
      line-height: 1;
    }

    .recent-empty {
      margin: 9px 0 0;
      color: rgba(255, 249, 232, .70);
      font-size: .78rem;
    }

    @supports (height: 100dvh) {
      body, main {
        min-height: 100dvh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .skybox-stars,
      .skybox-haze {
        transform: none;
      }

      .skybox-world {
        transform: scale(1.12);
      }

      .entry-card {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <main id="scene">
    <div class="skybox" aria-hidden="true">
      <div class="skybox-stars"></div>
      <div class="skybox-world"></div>
      <div class="skybox-haze"></div>
    </div>

    <form class="entry-card" id="memberForm" autocomplete="off">
      <p class="eyebrow">New Member Registration</p>
      <h1>Primordial Ooze</h1>

      <label for="name">Name</label>
      <input id="name" name="name" type="text" 
        placeholder="First Name Last Initial" autocapitalize="words" autofocus required>

      <label for="phone">Phone number</label>
      <input
        id="phone"
        name="phone"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        placeholder="(916) 555-1234"
        required
      >

      <label for="sobrietyDateEntry">Sobriety date</label>
      <input
        id="sobrietyDateEntry"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="MM/DD/YYYY"
        maxlength="10"
        pattern="(0[1-9]|1[0-2])/(0[1-9]|[12][0-9]|3[01])/[0-9]{4}"
        aria-describedby="dateHelp"
        required
      >
      <input id="sobrietyDate" name="sobrietyDate" type="hidden">
      <span id="dateHelp" hidden>Enter the date as month, day, and four-digit year.</span>

      <button id="submitButton" type="submit">Add member</button>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="recentEntries" class="recent-entries" hidden>
        <button
          id="recentToggle"
          class="recent-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="recentList"
        >Recent entries</button>
        <div id="recentList" hidden></div>
      </div>
    </form>
  </main>

  <script>
    const GOOGLE_APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbw2-f57uCj6ISI-SkfVoaJdI3FJQA7PRowe3tUFpYMZS0VKKAz-YMyuj3EoLuKAlc9Kfw/exec';

    const form = document.querySelector('#memberForm');
    const nameInput = document.querySelector('#name');
    const phoneInput = document.querySelector('#phone');
    const dateEntry = document.querySelector('#sobrietyDateEntry');
    const dateValue = document.querySelector('#sobrietyDate');
    const submitButton = document.querySelector('#submitButton');
    const status = document.querySelector('#status');
    const recentEntries = document.querySelector('#recentEntries');
    const recentToggle = document.querySelector('#recentToggle');
    const recentList = document.querySelector('#recentList');
    const root = document.documentElement;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const RECENT_ENTRIES_KEY = 'primordialOozeRecentEntries';
    let statusTimer;

    function getRecentEntries() {
      try {
        const saved = JSON.parse(localStorage.getItem(RECENT_ENTRIES_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch (error) {
        return [];
      }
    }

    function saveRecentEntries(entries) {
      try {
        localStorage.setItem(RECENT_ENTRIES_KEY, JSON.stringify(entries));
        return true;
      } catch (error) {
        return false;
      }
    }

    function formatSavedDate(isoDate) {
      const parts = String(isoDate).split('-');
      return parts.length === 3 ? parts[1] + '/' + parts[2] + '/' + parts[0] : isoDate;
    }

    function renderRecentEntries() {
      const entries = getRecentEntries();
      recentEntries.hidden = entries.length === 0;
      recentList.replaceChildren();

      if (!entries.length) {
        recentList.hidden = true;
        recentToggle.setAttribute('aria-expanded', 'false');
        return;
      }

      const list = document.createElement('ul');
      list.className = 'recent-list';

      entries.forEach(entry => {
        const item = document.createElement('li');
        item.className = 'recent-item';

        const details = document.createElement('div');
        details.className = 'recent-details';

        const memberName = document.createElement('strong');
        memberName.textContent = entry.name;
        const memberInfo = document.createElement('span');
        memberInfo.textContent = entry.phone + ' · ' + formatSavedDate(entry.sobrietyDate);
        details.append(memberName, memberInfo);

        const removeButton = document.createElement('button');
        removeButton.className = 'delete-entry';
        removeButton.type = 'button';
        removeButton.textContent = '×';
        removeButton.setAttribute('aria-label', 'Delete ' + entry.name + ' from recent entries');
        removeButton.dataset.entryId = entry.id;

        item.append(details, removeButton);
        list.append(item);
      });

      recentList.append(list);
    }

    function addRecentEntry(entry) {
      const entries = getRecentEntries();
      entries.unshift(entry);
      saveRecentEntries(entries);
      renderRecentEntries();
    }

    function showRecentLinkAfterDelay() {
      clearTimeout(statusTimer);
      recentEntries.hidden = true;
      statusTimer = setTimeout(() => {
        status.textContent = '';
        renderRecentEntries();
      }, 10000);
    }

    recentToggle.addEventListener('click', () => {
      const willOpen = recentList.hidden;
      recentList.hidden = !willOpen;
      recentToggle.setAttribute('aria-expanded', String(willOpen));
      recentToggle.textContent = willOpen ? 'Hide recent entries' : 'Recent entries';
    });

    recentList.addEventListener('click', event => {
      const removeButton = event.target.closest('.delete-entry');
      if (!removeButton) return;

      const entries = getRecentEntries().filter(entry => entry.id !== removeButton.dataset.entryId);
      saveRecentEntries(entries);
      renderRecentEntries();
    });

    renderRecentEntries();

    /* Smooth, spring-like skybox movement. */
    let targetX = 0;
    let targetY = 0;
    let currentX = 0;
    let currentY = 0;
    let velocityX = 0;
    let velocityY = 0;
    let pointerDown = false;
    let activePointerType = '';

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function setTargetFromPoint(clientX, clientY) {
      targetX = clamp((clientX / window.innerWidth - .5) * 2, -1, 1);
      targetY = clamp((clientY / window.innerHeight - .5) * 2, -1, 1);
    }

    window.addEventListener('pointerdown', event => {
      if (reduceMotion.matches) return;
      pointerDown = true;
      activePointerType = event.pointerType;
      setTargetFromPoint(event.clientX, event.clientY);
    }, { passive: true });

    window.addEventListener('pointermove', event => {
      if (reduceMotion.matches) return;

      if (event.pointerType === 'mouse' || pointerDown) {
        activePointerType = event.pointerType;
        setTargetFromPoint(event.clientX, event.clientY);
      }
    }, { passive: true });

    function releasePointer() {
      pointerDown = false;

      /* Touch swipes float back to center; mouse movement stays positional. */
      if (activePointerType !== 'mouse') {
        targetX = 0;
        targetY = 0;
      }
    }

    window.addEventListener('pointerup', releasePointer, { passive: true });
    window.addEventListener('pointercancel', releasePointer, { passive: true });
    window.addEventListener('blur', () => {
      targetX = 0;
      targetY = 0;
    });

    /* Phone tilt is an enhancement where the browser already permits it. */
    window.addEventListener('deviceorientation', event => {
      if (reduceMotion.matches || pointerDown) return;
      if (event.gamma == null || event.beta == null) return;

      targetX = clamp(event.gamma / 24, -1, 1);
      targetY = clamp((event.beta - 45) / 32, -1, 1);
    }, { passive: true });

    function animateSkybox() {
      if (!reduceMotion.matches) {
        const spring = .055;
        const damping = .82;

        velocityX = (velocityX + (targetX - currentX) * spring) * damping;
        velocityY = (velocityY + (targetY - currentY) * spring) * damping;
        currentX += velocityX;
        currentY += velocityY;

        root.style.setProperty('--sky-x', currentX.toFixed(4));
        root.style.setProperty('--sky-y', currentY.toFixed(4));
        root.style.setProperty('--card-x', (currentX * 3.5).toFixed(2) + 'px');
        root.style.setProperty('--card-y', (currentY * 3.5).toFixed(2) + 'px');
      }

      requestAnimationFrame(animateSkybox);
    }

    animateSkybox();

    phoneInput.addEventListener('blur', () => {
      const digits = phoneInput.value.replace(/\D/g, '').slice(-10);
      if (digits.length === 10) {
        phoneInput.value =
          '(' + digits.slice(0, 3) + ') ' +
          digits.slice(3, 6) + '-' +
          digits.slice(6);
      }
    });

    dateEntry.addEventListener('input', () => {
      const digits = dateEntry.value.replace(/\D/g, '').slice(0, 8);
      let formatted = digits.slice(0, 2);
      if (digits.length > 2) formatted += '/' + digits.slice(2, 4);
      if (digits.length > 4) formatted += '/' + digits.slice(4, 8);
      dateEntry.value = formatted;
      dateEntry.setCustomValidity('');
    });

    function prepareSobrietyDate() {
      const match = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(dateEntry.value);
      if (!match) {
        dateEntry.setCustomValidity('Enter the date as MM/DD/YYYY.');
        return false;
      }

      const month = Number(match[1]);
      const day = Number(match[2]);
      const year = Number(match[3]);
      const date = new Date(year, month - 1, day);
      const isRealDate =
        date.getFullYear() === year &&
        date.getMonth() === month - 1 &&
        date.getDate() === day;

      if (!isRealDate) {
        dateEntry.setCustomValidity('Enter a real calendar date.');
        return false;
      }

      dateEntry.setCustomValidity('');
      dateValue.value =
        String(year).padStart(4, '0') + '-' +
        String(month).padStart(2, '0') + '-' +
        String(day).padStart(2, '0');
      return true;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!prepareSobrietyDate()) {
        form.reportValidity();
        return;
      }
      if (!form.reportValidity()) return;

      submitButton.disabled = true;
      submitButton.textContent = 'Adding…';
      status.textContent = 'Adding member…';

      try {
        const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(Object.fromEntries(new FormData(form)))
        });

        const result = await response.json();

        if (!result.ok) {
          throw new Error(result.error || 'Unable to add member.');
        }

        const submittedEntry = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2),
          name: result.name || nameInput.value.trim(),
          phone: phoneInput.value.trim(),
          sobrietyDate: dateValue.value,
          addedAt: new Date().toISOString()
        };

        addRecentEntry(submittedEntry);
        form.reset();
        nameInput.focus();
        status.textContent = submittedEntry.name + ' was added.';
        showRecentLinkAfterDelay();
      } catch (error) {
        status.textContent = error.message || 'Unable to add member.';
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Add member';
      }
    });
  </script>
</body>
</html>
