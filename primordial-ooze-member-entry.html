<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  >
  <meta name="theme-color" content="#05080d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ooze Entry">
  <meta name="description" content="Add a member to the Primordial Ooze member list.">

  <link rel="manifest" href="member-entry.webmanifest">
  <link rel="icon" type="image/png" sizes="16x16" href="icon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <title>Primordial Ooze Member Entry</title>

  <style>
    :root {
      color-scheme: dark;
      --sky-x: 0;
      --sky-y: 0;
      --card-x: 0px;
      --card-y: 0px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      height: 100%;
      min-height: -webkit-fill-available;
      margin: 0;
      overflow: hidden;
      background: #05080d;
    }

    body {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      margin: 0;
      overflow: hidden;
      background: #05080d;
      color: #fff8e8;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      overscroll-behavior: none;
    }

    main {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100vh;
      height: -webkit-fill-available;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding:
        max(22px, env(safe-area-inset-top))
        18px
        max(22px, env(safe-area-inset-bottom));
      overflow-x: hidden;
      overflow-y: auto;
      text-align: center;
      -webkit-overflow-scrolling: touch;
    }

    .app-stack {
      width: min(100%, 390px);
      margin: 0 auto;
    }

    /*
      The background is split into three depths. The large negative insets keep
      the edge of the image outside the screen even during a full swipe.
    */
    .skybox,
    .skybox > div {
      position: fixed;
      pointer-events: none;
    }

    .skybox {
      z-index: -3;
      inset: -2px;
      overflow: hidden;
      background: #05080d;
    }

    .skybox-stars {
      inset: -10vmax;
      opacity: 0.38;
      background-image:
        radial-gradient(
          circle at 18% 27%,
          rgba(255, 255, 255, 0.9) 0 1px,
          transparent 1.6px
        ),
        radial-gradient(
          circle at 72% 63%,
          rgba(255, 226, 157, 0.85) 0 1px,
          transparent 1.7px
        ),
        radial-gradient(
          circle at 44% 81%,
          rgba(189, 224, 255, 0.8) 0 0.8px,
          transparent 1.4px
        );
      background-size: 83px 91px, 127px 119px, 157px 143px;
      transform: translate3d(
        calc(var(--sky-x) * -9px),
        calc(var(--sky-y) * -9px),
        0
      );
      will-change: transform;
    }

    .skybox-world {
      inset: -15vmax;
      background:
        #05080d
        url("primordial_ooze_member_entry_bg.png")
        center center / cover no-repeat;
      transform:
        perspective(900px)
        translate3d(
          calc(var(--sky-x) * -42px),
          calc(var(--sky-y) * -42px),
          0
        )
        rotateY(calc(var(--sky-x) * 1.65deg))
        rotateX(calc(var(--sky-y) * -1.65deg))
        scale(1.12);
      transform-origin: center;
      will-change: transform;
    }

    .skybox-haze {
      inset: -18vmax;
      opacity: 0.26;
      filter: blur(18px);
      background:
        radial-gradient(
          ellipse at 66% 38%,
          rgba(229, 177, 67, 0.42),
          transparent 43%
        ),
        radial-gradient(
          ellipse at 25% 70%,
          rgba(33, 119, 96, 0.28),
          transparent 48%
        );
      transform: translate3d(
        calc(var(--sky-x) * -62px),
        calc(var(--sky-y) * -62px),
        0
      );
      will-change: transform;
    }

    main::after {
      content: "";
      position: fixed;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(2, 5, 10, 0.18),
        rgba(2, 5, 10, 0.03) 48%,
        rgba(2, 5, 10, 0.30)
      );
    }

    .entry-card {
      width: 100%;
      padding: 25px;
      border: 1px solid rgba(255, 222, 146, 0.28);
      border-radius: 24px;
      background: linear-gradient(
        145deg,
        rgba(8, 16, 24, 0.30),
        rgba(15, 19, 24, 0.18)
      );
      box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.34),
        inset 0 1px rgba(255, 255, 255, 0.08);
      -webkit-backdrop-filter: blur(13px) saturate(135%);
      backdrop-filter: blur(13px) saturate(135%);
      transform: translate3d(var(--card-x), var(--card-y), 0);
      will-change: transform;
    }

    .entry-card + .entry-card {
      margin-top: 16px;
    }

    .eyebrow {
      min-height: 0;
      margin: 0 0 7px;
      color: #e4b953;
      font-size: 0.71rem;
      font-weight: 800;
      letter-spacing: 0.17em;
      text-transform: uppercase;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85);
    }

    h1 {
      margin: 0 0 21px;
      font-size: 1.82rem;
      line-height: 1;
      letter-spacing: -0.025em;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.95);
    }

    input,
    button {
      width: 100%;
      min-height: 54px;
      border-radius: 13px;
      font: inherit;
    }

    input {
      display: block;
      margin: 0;
      padding: 0 15px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(246, 248, 248, 0.82);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.45),
        0 5px 20px rgba(0, 0, 0, 0.10);
      color: #101820;
      font-size: 16px;
    }

    /*
      This creates one consistent gap between each visible input field.
      Hidden inputs are ignored.
    */
    input:not([type="hidden"]) + input:not([type="hidden"]) {
      margin-top: 12px;
    }

    input::placeholder {
      color: rgba(16, 24, 32, 0.52);
    }

    input:focus {
      outline: 3px solid rgba(237, 190, 78, 0.55);
      border-color: #e9be59;
      background: rgba(255, 255, 255, 0.94);
    }

    button {
      margin-top: 21px;
      border: 1px solid rgba(255, 235, 178, 0.32);
      background: linear-gradient(
        135deg,
        rgba(249, 214, 125, 0.92),
        rgba(177, 116, 26, 0.91)
      );
      box-shadow:
        0 8px 28px rgba(67, 40, 0, 0.34),
        inset 0 1px rgba(255, 255, 255, 0.34);
      color: #172018;
      font-weight: 850;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(1px) scale(0.995);
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    [role="status"] {
      min-height: 1.25em;
      margin: 12px 2px 0;
      color: #ffe8aa;
      font-size: 0.87rem;
      text-shadow: 0 1px 8px #000;
    }

    .recent-entries {
      margin-top: 10px;
    }

    .recent-toggle {
      display: inline-block;
      width: auto;
      min-height: 0;
      margin: 0;
      padding: 4px 2px;
      border: 0;
      background: none;
      box-shadow: none;
      color: #ffe8aa;
      font-size: 0.87rem;
      font-weight: 750;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .recent-toggle:active {
      transform: none;
    }

    .recent-list {
      max-height: 210px;
      margin: 9px 0 0;
      padding: 0;
      overflow-y: auto;
      list-style: none;
      text-align: left;
    }

    .recent-item {
      display: grid;
      grid-template-columns: 1fr 34px;
      gap: 9px;
      align-items: center;
      padding: 9px 0;
      border-top: 1px solid rgba(255, 232, 170, 0.18);
    }

    .recent-details {
      min-width: 0;
      color: rgba(255, 249, 232, 0.94);
      font-size: 0.78rem;
      line-height: 1.35;
      text-shadow: 0 1px 7px #000;
    }

    .recent-details strong {
      display: block;
      overflow: hidden;
      color: #ffe8aa;
      font-size: 0.86rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .delete-entry {
      width: 34px;
      min-height: 34px;
      margin: 0;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 50%;
      background: rgba(5, 8, 13, 0.48);
      box-shadow: none;
      color: #ffe8aa;
      font-size: 1.15rem;
      line-height: 1;
    }

    .recent-empty {
      margin: 9px 0 0;
      color: rgba(255, 249, 232, 0.70);
      font-size: 0.78rem;
    }

    .dashboard-card {
      text-align: left;
    }

    .dashboard-card h1 {
      margin-bottom: 5px;
      text-align: center;
    }

    .dashboard-card .eyebrow,
    .meeting-date,
    .dashboard-message {
      text-align: center;
    }

    .meeting-date {
      margin: 0 0 17px;
      color: rgba(255, 248, 232, 0.82);
      font-size: 0.83rem;
      text-shadow: 0 1px 8px #000;
    }

    .dashboard-message {
      margin: 11px 0;
      color: rgba(255, 248, 232, 0.76);
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .needs-list,
    .inventory-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .need-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid rgba(255, 232, 170, 0.18);
    }

    .need-row:first-child {
      border-top: 0;
    }

    .need-name {
      color: #ffe8aa;
      font-size: 0.91rem;
      font-weight: 800;
    }

    .need-members {
      display: block;
      margin-top: 3px;
      color: rgba(255, 248, 232, 0.76);
      font-size: 0.75rem;
      line-height: 1.35;
    }

    .need-count {
      align-self: start;
      min-width: 58px;
      padding: 4px 8px;
      border: 1px solid rgba(255, 232, 170, 0.22);
      border-radius: 999px;
      background: rgba(5, 8, 13, 0.32);
      color: #fff3cf;
      font-size: 0.73rem;
      font-weight: 800;
      text-align: center;
    }

    .shortage-box {
      margin: 12px 0 0;
      padding: 11px 12px;
      border: 1px solid rgba(231, 180, 65, 0.32);
      border-radius: 13px;
      background: rgba(89, 55, 5, 0.22);
      color: #ffe8aa;
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .inventory-details {
      margin-top: 16px;
      border-top: 1px solid rgba(255, 232, 170, 0.18);
    }

    .inventory-details summary {
      padding: 14px 2px 5px;
      color: #ffe8aa;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }

    .inventory-list {
      max-height: min(43vh, 355px);
      margin-top: 7px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .inventory-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      padding: 8px 1px;
      border-top: 1px solid rgba(255, 232, 170, 0.14);
    }

    .inventory-label {
      min-width: 0;
      color: rgba(255, 248, 232, 0.92);
      font-size: 0.82rem;
    }

    .inventory-label small {
      display: block;
      margin-top: 2px;
      color: rgba(255, 248, 232, 0.58);
      font-size: 0.68rem;
    }

    .inventory-stepper {
      display: grid;
      grid-template-columns: 32px 34px 32px;
      align-items: center;
      border: 1px solid rgba(255, 232, 170, 0.22);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(5, 8, 13, 0.34);
    }

    .inventory-stepper button {
      width: 32px;
      min-height: 34px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: #ffe8aa;
      font-size: 1.15rem;
    }

    .inventory-count {
      color: #fff8e8;
      font-size: 0.85rem;
      font-weight: 850;
      text-align: center;
    }

    .save-inventory {
      min-height: 48px;
      margin-top: 13px;
    }

    .inventory-status {
      min-height: 1.2em;
      margin: 9px 0 0;
      color: #ffe8aa;
      font-size: 0.76rem;
      text-align: center;
    }

    .refresh-button {
      display: block;
      width: auto;
      min-height: 0;
      margin: 8px auto 0;
      padding: 4px;
      border: 0;
      background: none;
      box-shadow: none;
      color: rgba(255, 232, 170, 0.82);
      font-size: 0.74rem;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @supports (height: 100dvh) {
      body {
        min-height: 100dvh;
      }

      main {
        height: 100dvh;
        min-height: 100dvh;
      }
    }

    @media (max-height: 650px) {
      main {
        align-items: start;
        overflow-y: auto;
      }

      .entry-card {
        padding: 20px;
      }

      h1 {
        margin-bottom: 17px;
      }

      input,
      button {
        min-height: 50px;
      }

      button {
        margin-top: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .skybox-stars,
      .skybox-haze {
        transform: none;
      }

      .skybox-world {
        transform: scale(1.12);
      }

      .entry-card {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <main id="scene">
    <div class="skybox" aria-hidden="true">
      <div class="skybox-stars"></div>
      <div class="skybox-world"></div>
      <div class="skybox-haze"></div>
    </div>

    <div class="app-stack">
      <section class="entry-card dashboard-card" aria-labelledby="chipHeading">
        <p class="eyebrow">Birthday &amp; Chip Manager</p>
        <h1 id="chipHeading">Loading…</h1>
        <p id="meetingDate" class="meeting-date">Checking the member list</p>

        <div id="monthlyNeeds">
          <p class="dashboard-message">Loading this month’s chip needs…</p>
        </div>

        <div id="shortageSummary" hidden></div>

        <details id="inventoryDetails" class="inventory-details">
          <summary id="inventorySummary">Chip inventory</summary>
          <ul id="inventoryList" class="inventory-list"></ul>
          <button
            id="saveInventoryButton"
            class="save-inventory"
            type="button"
            disabled
          >
            Save inventory
          </button>
          <p id="inventoryStatus" class="inventory-status" aria-live="polite"></p>
        </details>

        <button id="refreshDashboard" class="refresh-button" type="button">
          Refresh birthday list
        </button>
      </section>

      <form class="entry-card" id="memberForm" autocomplete="off">
      <p class="eyebrow">New Member Registration</p>
      <h1>Primordial Ooze</h1>

      <input
        id="name"
        name="name"
        type="text"
        placeholder="First Name Last Initial ."
        autocapitalize="words"
        autofocus
        required
      >

      <input
        id="phone"
        name="phone"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        placeholder="(916) 555-1234"
        required
      >

      <input
        id="sobrietyDateEntry"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="MM/DD/YYYY"
        maxlength="10"
        pattern="(0[1-9]|1[0-2])/(0[1-9]|[12][0-9]|3[01])/[0-9]{4}"
        aria-describedby="dateHelp"
        required
      >

      <input
        id="sobrietyDate"
        name="sobrietyDate"
        type="hidden"
      >

      <span id="dateHelp" hidden>
        Enter the date as month, day, and four-digit year.
      </span>

      <button id="submitButton" type="submit">
        Add member
      </button>

      <p id="status" role="status" aria-live="polite"></p>

      <div id="recentEntries" class="recent-entries" hidden>
        <button
          id="recentToggle"
          class="recent-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="recentList"
        >
          Recent entries
        </button>

        <div id="recentList" hidden></div>
      </div>
      </form>
    </div>
  </main>

  <script>
    const GOOGLE_APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbzgWPaW2JHEryBJNTXTODqGlA4zE4Q6Wk27bD6VW_t1h820I8SfG32E4vQfrLUTyLRF/exec';

    const form = document.querySelector('#memberForm');
    const nameInput = document.querySelector('#name');
    const phoneInput = document.querySelector('#phone');
    const dateEntry = document.querySelector('#sobrietyDateEntry');
    const dateValue = document.querySelector('#sobrietyDate');
    const submitButton = document.querySelector('#submitButton');
    const status = document.querySelector('#status');
    const recentEntries = document.querySelector('#recentEntries');
    const recentToggle = document.querySelector('#recentToggle');
    const recentList = document.querySelector('#recentList');
    const chipHeading = document.querySelector('#chipHeading');
    const meetingDate = document.querySelector('#meetingDate');
    const monthlyNeeds = document.querySelector('#monthlyNeeds');
    const shortageSummary = document.querySelector('#shortageSummary');
    const inventoryDetails = document.querySelector('#inventoryDetails');
    const inventorySummary = document.querySelector('#inventorySummary');
    const inventoryList = document.querySelector('#inventoryList');
    const saveInventoryButton = document.querySelector('#saveInventoryButton');
    const inventoryStatus = document.querySelector('#inventoryStatus');
    const refreshDashboard = document.querySelector('#refreshDashboard');
    const root = document.documentElement;

    const reduceMotion = window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    );

    const RECENT_ENTRIES_KEY = 'primordialOozeRecentEntries';

    let statusTimer;
    let dashboardInventory = [];
    let savedInventoryCounts = new Map();

    function formatMilestoneDate(isoDate) {
      const date = new Date(isoDate + 'T12:00:00');

      return date.toLocaleDateString(undefined, {
        month: 'numeric',
        day: 'numeric'
      });
    }

    function renderDashboard(data) {
      dashboardInventory = data.inventory.map(item => ({ ...item }));
      savedInventoryCounts = new Map(
        dashboardInventory.map(item => [item.chipId, item.onHand])
      );

      chipHeading.textContent = data.monthLabel + ' Chips';
      meetingDate.textContent = 'Birthday meeting · ' + data.meetingDate;
      inventorySummary.textContent =
        'Chip inventory · ' +
        dashboardInventory.reduce((sum, item) => sum + item.onHand, 0) +
        ' total';

      monthlyNeeds.replaceChildren();

      const neededItems = dashboardInventory.filter(
        item => item.neededThisMonth > 0
      );

      if (!neededItems.length) {
        const empty = document.createElement('p');
        empty.className = 'dashboard-message';
        empty.textContent = 'No listed members reach a chip milestone this month.';
        monthlyNeeds.append(empty);
      } else {
        const list = document.createElement('ul');
        list.className = 'needs-list';

        neededItems.forEach(item => {
          const row = document.createElement('li');
          row.className = 'need-row';

          const info = document.createElement('div');
          const label = document.createElement('span');
          label.className = 'need-name';
          label.textContent = item.displayName;

          const members = document.createElement('span');
          members.className = 'need-members';
          members.textContent = item.members
            .map(member => member.name + ' · ' + formatMilestoneDate(member.date))
            .join(', ');

          const count = document.createElement('span');
          count.className = 'need-count';
          count.textContent = 'Need ' + item.neededThisMonth;

          info.append(label, members);
          row.append(info, count);
          list.append(row);
        });

        monthlyNeeds.append(list);
      }

      renderShortages();
      renderInventory();
      saveInventoryButton.disabled = true;
      inventoryStatus.textContent = '';
    }

    function renderShortages() {
      const preparationItems = dashboardInventory.filter(
        item => item.chipId === '24H' || item.neededThisMonth > 0
      );

      const shortages = preparationItems
        .map(item => ({
          displayName: item.displayName,
          amount: Math.max(
            0,
            item.neededThisMonth + item.reserveTarget - item.onHand
          )
        }))
        .filter(item => item.amount > 0);

      shortageSummary.replaceChildren();

      if (!shortages.length) {
        shortageSummary.hidden = true;
        return;
      }

      shortageSummary.hidden = false;
      shortageSummary.className = 'shortage-box';

      const strong = document.createElement('strong');
      strong.textContent = 'Obtain before the meeting: ';

      const text = document.createTextNode(
        shortages
          .map(item => item.displayName + ' × ' + item.amount)
          .join(' · ')
      );

      shortageSummary.append(strong, text);
    }

    function renderInventory() {
      inventoryList.replaceChildren();

      dashboardInventory.forEach(item => {
        const row = document.createElement('li');
        row.className = 'inventory-row';
        row.dataset.chipId = item.chipId;

        const label = document.createElement('div');
        label.className = 'inventory-label';
        label.textContent = item.displayName;

        const note = document.createElement('small');
        note.textContent =
          'Need ' + item.neededThisMonth +
          ' · Reserve ' + item.reserveTarget;
        label.append(note);

        const stepper = document.createElement('div');
        stepper.className = 'inventory-stepper';

        const minus = document.createElement('button');
        minus.type = 'button';
        minus.dataset.adjust = '-1';
        minus.setAttribute('aria-label', 'Remove one ' + item.displayName + ' chip');
        minus.textContent = '−';

        const count = document.createElement('span');
        count.className = 'inventory-count';
        count.textContent = item.onHand;

        const plus = document.createElement('button');
        plus.type = 'button';
        plus.dataset.adjust = '1';
        plus.setAttribute('aria-label', 'Add one ' + item.displayName + ' chip');
        plus.textContent = '+';

        stepper.append(minus, count, plus);
        row.append(label, stepper);
        inventoryList.append(row);
      });
    }

    async function loadDashboard() {
      refreshDashboard.disabled = true;
      refreshDashboard.textContent = 'Refreshing…';
      inventoryStatus.textContent = '';

      try {
        const response = await fetch(
          GOOGLE_APPS_SCRIPT_URL + '?action=dashboard&t=' + Date.now()
        );
        const data = await response.json();

        if (!data.ok) {
          throw new Error(data.error || 'Unable to load chip inventory.');
        }

        renderDashboard(data);
      } catch (error) {
        chipHeading.textContent = 'Chip Manager';
        meetingDate.textContent = '';
        monthlyNeeds.innerHTML = '';

        const message = document.createElement('p');
        message.className = 'dashboard-message';
        message.textContent = error.message || 'Unable to load chip inventory.';
        monthlyNeeds.append(message);
      } finally {
        refreshDashboard.disabled = false;
        refreshDashboard.textContent = 'Refresh birthday list';
      }
    }

    inventoryList.addEventListener('click', event => {
      const button = event.target.closest('[data-adjust]');
      if (!button) return;

      const row = button.closest('.inventory-row');
      const item = dashboardInventory.find(
        inventoryItem => inventoryItem.chipId === row.dataset.chipId
      );

      if (!item) return;

      item.onHand = Math.max(
        0,
        Math.min(999, item.onHand + Number(button.dataset.adjust))
      );

      row.querySelector('.inventory-count').textContent = item.onHand;
      saveInventoryButton.disabled = !dashboardInventory.some(
        inventoryItem =>
          inventoryItem.onHand !== savedInventoryCounts.get(inventoryItem.chipId)
      );
      inventoryStatus.textContent = saveInventoryButton.disabled
        ? ''
        : 'Unsaved inventory changes';
      renderShortages();
    });

    saveInventoryButton.addEventListener('click', async () => {
      const changedInventory = dashboardInventory
        .filter(item => item.onHand !== savedInventoryCounts.get(item.chipId))
        .map(item => ({ chipId: item.chipId, onHand: item.onHand }));

      if (!changedInventory.length) return;

      saveInventoryButton.disabled = true;
      saveInventoryButton.textContent = 'Saving…';
      inventoryStatus.textContent = 'Updating the inventory sheet…';

      try {
        const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action: 'saveInventory',
            inventory: changedInventory
          })
        });
        const result = await response.json();

        if (!result.ok) {
          throw new Error(result.error || 'Unable to save inventory.');
        }

        await loadDashboard();
        inventoryDetails.open = true;
        inventoryStatus.textContent = 'Inventory saved.';
      } catch (error) {
        inventoryStatus.textContent = error.message || 'Unable to save inventory.';
        saveInventoryButton.disabled = false;
      } finally {
        saveInventoryButton.textContent = 'Save inventory';
      }
    });

    refreshDashboard.addEventListener('click', loadDashboard);
    loadDashboard();

    function getRecentEntries() {
      try {
        const saved = JSON.parse(
          localStorage.getItem(RECENT_ENTRIES_KEY)
        );

        return Array.isArray(saved) ? saved : [];
      } catch (error) {
        return [];
      }
    }

    function saveRecentEntries(entries) {
      try {
        localStorage.setItem(
          RECENT_ENTRIES_KEY,
          JSON.stringify(entries)
        );

        return true;
      } catch (error) {
        return false;
      }
    }

    function formatSavedDate(isoDate) {
      const parts = String(isoDate).split('-');

      return parts.length === 3
        ? parts[1] + '/' + parts[2] + '/' + parts[0]
        : isoDate;
    }

    function renderRecentEntries() {
      const entries = getRecentEntries();

      recentEntries.hidden = entries.length === 0;
      recentList.replaceChildren();

      if (!entries.length) {
        recentList.hidden = true;
        recentToggle.setAttribute('aria-expanded', 'false');
        recentToggle.textContent = 'Recent entries';
        return;
      }

      const list = document.createElement('ul');
      list.className = 'recent-list';

      entries.forEach(entry => {
        const item = document.createElement('li');
        item.className = 'recent-item';

        const details = document.createElement('div');
        details.className = 'recent-details';

        const memberName = document.createElement('strong');
        memberName.textContent = entry.name;

        const memberInfo = document.createElement('span');
        memberInfo.textContent =
          entry.phone +
          ' · ' +
          formatSavedDate(entry.sobrietyDate);

        details.append(memberName, memberInfo);

        const removeButton = document.createElement('button');
        removeButton.className = 'delete-entry';
        removeButton.type = 'button';
        removeButton.textContent = '×';
        removeButton.setAttribute(
          'aria-label',
          'Delete ' + entry.name + ' from recent entries'
        );
        removeButton.dataset.entryId = entry.id;

        item.append(details, removeButton);
        list.append(item);
      });

      recentList.append(list);
    }

    function addRecentEntry(entry) {
      const entries = getRecentEntries();

      entries.unshift(entry);
      saveRecentEntries(entries);
      renderRecentEntries();
    }

    function showRecentLinkAfterDelay() {
      clearTimeout(statusTimer);
      recentEntries.hidden = true;

      statusTimer = setTimeout(() => {
        status.textContent = '';
        renderRecentEntries();
      }, 10000);
    }

    recentToggle.addEventListener('click', () => {
      const willOpen = recentList.hidden;

      recentList.hidden = !willOpen;
      recentToggle.setAttribute(
        'aria-expanded',
        String(willOpen)
      );
      recentToggle.textContent = willOpen
        ? 'Hide recent entries'
        : 'Recent entries';
    });

    recentList.addEventListener('click', event => {
      const removeButton = event.target.closest('.delete-entry');

      if (!removeButton) return;

      const entries = getRecentEntries().filter(
        entry => entry.id !== removeButton.dataset.entryId
      );

      saveRecentEntries(entries);
      renderRecentEntries();
    });

    renderRecentEntries();

    /* Smooth, spring-like skybox movement. */
    let targetX = 0;
    let targetY = 0;
    let currentX = 0;
    let currentY = 0;
    let velocityX = 0;
    let velocityY = 0;
    let pointerDown = false;
    let activePointerType = '';

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function setTargetFromPoint(clientX, clientY) {
      targetX = clamp(
        (clientX / window.innerWidth - 0.5) * 2,
        -1,
        1
      );

      targetY = clamp(
        (clientY / window.innerHeight - 0.5) * 2,
        -1,
        1
      );
    }

    window.addEventListener('pointerdown', event => {
      if (reduceMotion.matches) return;

      pointerDown = true;
      activePointerType = event.pointerType;
      setTargetFromPoint(event.clientX, event.clientY);
    }, { passive: true });

    window.addEventListener('pointermove', event => {
      if (reduceMotion.matches) return;

      if (event.pointerType === 'mouse' || pointerDown) {
        activePointerType = event.pointerType;
        setTargetFromPoint(event.clientX, event.clientY);
      }
    }, { passive: true });

    function releasePointer() {
      pointerDown = false;

      /*
        Touch swipes float back to center.
        Mouse movement stays positional.
      */
      if (activePointerType !== 'mouse') {
        targetX = 0;
        targetY = 0;
      }
    }

    window.addEventListener(
      'pointerup',
      releasePointer,
      { passive: true }
    );

    window.addEventListener(
      'pointercancel',
      releasePointer,
      { passive: true }
    );

    window.addEventListener('blur', () => {
      targetX = 0;
      targetY = 0;
    });

    /*
      Phone tilt is an enhancement where the browser
      already permits device orientation.
    */
    window.addEventListener('deviceorientation', event => {
      if (reduceMotion.matches || pointerDown) return;
      if (event.gamma == null || event.beta == null) return;

      targetX = clamp(event.gamma / 24, -1, 1);
      targetY = clamp((event.beta - 45) / 32, -1, 1);
    }, { passive: true });

    function animateSkybox() {
      if (!reduceMotion.matches) {
        const spring = 0.055;
        const damping = 0.82;

        velocityX =
          (velocityX + (targetX - currentX) * spring) *
          damping;

        velocityY =
          (velocityY + (targetY - currentY) * spring) *
          damping;

        currentX += velocityX;
        currentY += velocityY;

        root.style.setProperty(
          '--sky-x',
          currentX.toFixed(4)
        );

        root.style.setProperty(
          '--sky-y',
          currentY.toFixed(4)
        );

        root.style.setProperty(
          '--card-x',
          (currentX * 3.5).toFixed(2) + 'px'
        );

        root.style.setProperty(
          '--card-y',
          (currentY * 3.5).toFixed(2) + 'px'
        );
      }

      requestAnimationFrame(animateSkybox);
    }

    animateSkybox();

    phoneInput.addEventListener('blur', () => {
      const digits = phoneInput.value
        .replace(/\D/g, '')
        .slice(-10);

      if (digits.length === 10) {
        phoneInput.value =
          '(' + digits.slice(0, 3) + ') ' +
          digits.slice(3, 6) + '-' +
          digits.slice(6);
      }
    });

    dateEntry.addEventListener('input', () => {
      const digits = dateEntry.value
        .replace(/\D/g, '')
        .slice(0, 8);

      let formatted = digits.slice(0, 2);

      if (digits.length > 2) {
        formatted += '/' + digits.slice(2, 4);
      }

      if (digits.length > 4) {
        formatted += '/' + digits.slice(4, 8);
      }

      dateEntry.value = formatted;
      dateEntry.setCustomValidity('');
    });

    function prepareSobrietyDate() {
      const match =
        /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(
          dateEntry.value
        );

      if (!match) {
        dateEntry.setCustomValidity(
          'Enter the date as MM/DD/YYYY.'
        );
        return false;
      }

      const month = Number(match[1]);
      const day = Number(match[2]);
      const year = Number(match[3]);
      const date = new Date(year, month - 1, day);

      const isRealDate =
        date.getFullYear() === year &&
        date.getMonth() === month - 1 &&
        date.getDate() === day;

      if (!isRealDate) {
        dateEntry.setCustomValidity(
          'Enter a real calendar date.'
        );
        return false;
      }

      dateEntry.setCustomValidity('');

      dateValue.value =
        String(year).padStart(4, '0') + '-' +
        String(month).padStart(2, '0') + '-' +
        String(day).padStart(2, '0');

      return true;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();

      if (!prepareSobrietyDate()) {
        form.reportValidity();
        return;
      }

      if (!form.reportValidity()) return;

      submitButton.disabled = true;
      submitButton.textContent = 'Adding…';
      status.textContent = 'Adding member…';

      try {
        const response = await fetch(
          GOOGLE_APPS_SCRIPT_URL,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(
              {
                action: 'addMember',
                ...Object.fromEntries(new FormData(form))
              }
            )
          }
        );

        const result = await response.json();

        if (!result.ok) {
          throw new Error(
            result.error || 'Unable to add member.'
          );
        }

        const submittedEntry = {
          id:
            Date.now().toString(36) +
            Math.random().toString(36).slice(2),
          name:
            result.name ||
            nameInput.value.trim(),
          phone: phoneInput.value.trim(),
          sobrietyDate: dateValue.value,
          addedAt: new Date().toISOString()
        };

        addRecentEntry(submittedEntry);
        form.reset();
        nameInput.focus();

        status.textContent =
          submittedEntry.name + ' was added.';

        showRecentLinkAfterDelay();
        loadDashboard();
      } catch (error) {
        status.textContent =
          error.message || 'Unable to add member.';
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Add member';
      }
    });
  </script>
</body>
</html>
