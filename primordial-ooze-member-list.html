<!doctype html>
<html lang="en">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Member Directory</title>
    <?!= include('Styles'); ?>
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="Member directory">
        <header class="app-header">
          <div class="header-copy">
            <span class="header-kicker">Member Directory</span>
            <h1>Primordial Ooze</h1>
            <p id="memberCount">Loading members...</p>
          </div>
          <button class="secondary refresh-button" id="refreshButton" type="button">
            <span class="refresh-mark" aria-hidden="true"></span>
            <span>Refresh</span>
          </button>
        </header>

        <div class="content-grid">
          <form class="editor" id="memberForm">
            <input id="rowNumber" name="rowNumber" type="hidden">

            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>

            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" required>

            <label for="sobrietyDate">Sobriety Date</label>
            <input id="sobrietyDate" name="sobrietyDate" type="date" required>

            <div class="actions">
              <button id="saveButton" type="submit">Add Member</button>
              <button class="secondary" id="clearButton" type="button">Clear</button>
              <button class="danger" id="deleteButton" type="button" disabled>Remove</button>
            </div>
          </form>

          <section class="member-panel" aria-label="Current members">
            <div class="search-row">
              <input id="searchInput" type="search" placeholder="Search members">
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Sobriety Date</th>
                  </tr>
                </thead>
                <tbody id="memberRows"></tbody>
              </table>
            </div>
          </section>
        </div>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <?!= include('Script'); ?>
  </body>
</html>
